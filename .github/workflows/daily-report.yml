name: Daily report

on:
  schedule:
    # Chiusura NYSE: 20:00 UTC con ora legale USA, 21:00 UTC con ora solare.
    # Lo script invia solo nell'ora successiva alla chiusura effettiva.
    - cron: "10 20,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Avvio manuale: invia subito, senza controllare l'orario
      FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily report
        run: python daily_report.py
