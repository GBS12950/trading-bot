name: Run trading bot

on:
  schedule:
    # Ogni 10 min, lun-ven, 13-21 UTC (copre l'orario NYSE con ora legale e solare)
    - cron: "*/59 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENTIMENT_MODE: vader
      DRY_RUN: "false"
      # since_close = notizie dalla chiusura precedente | minutes = ultime NEWS_MAX_AGE_MINUTES
      NEWS_WINDOW: since_close
      NEWS_MAX_AGE_MINUTES: "60"
      MAX_OPEN_POSITIONS: "20"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py
